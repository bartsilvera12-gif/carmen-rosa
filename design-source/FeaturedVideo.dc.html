<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<div style="position:relative; width:100%; background:#050507; border:1px solid rgba(203,177,122,0.35); box-shadow:0 0 60px rgba(61,90,143,0.22); transition:box-shadow 0.6s ease, border-color 0.6s ease;" style-hover="box-shadow:0 0 70px rgba(203,177,122,0.28); border-color:rgba(227,207,160,0.7);">
  <div style="position:relative; width:100%; aspect-ratio:16/9; background:#000;">
    <sc-if value="{{ playing }}" hint-placeholder-val="{{ false }}">
      <iframe src="{{ embedUrl }}" title="{{ iframeTitle }}" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen="allowfullscreen" style="position:absolute; inset:0; width:100%; height:100%; border:0;"></iframe>
    </sc-if>
    <sc-if value="{{ notPlaying }}" hint-placeholder-val="{{ true }}">
      <button type="button" onClick="{{ play }}" aria-label="{{ ariaPlay }}" style="position:absolute; inset:0; width:100%; height:100%; padding:0; margin:0; border:0; background:#000; cursor:pointer; display:block; text-align:left;">
        <img src="{{ thumbUrl }}" onError="{{ thumbError }}" alt="" style="position:absolute; inset:0; width:100%; height:100%; object-fit:cover; opacity:0.85;" />
        <div style="position:absolute; inset:0; background:linear-gradient(to top, rgba(3,4,8,0.88) 0%, rgba(3,4,8,0.15) 40%, rgba(3,4,8,0.25) 100%); pointer-events:none;"></div>
        <div style="position:absolute; top:50%; left:50%; transform:translate(-50%,-50%); width:clamp(56px,12vw,88px); height:clamp(56px,12vw,88px); border-radius:50%; border:1px solid rgba(227,207,160,0.85); background:rgba(5,5,10,0.45); backdrop-filter:blur(6px); display:flex; align-items:center; justify-content:center; transition:background 0.4s ease;">
          <div style="width:0; height:0; border-top:12px solid transparent; border-bottom:12px solid transparent; border-left:19px solid #e3cfa0; margin-left:5px;"></div>
        </div>
        <div style="position:absolute; left:clamp(16px,4vw,36px); right:clamp(16px,4vw,36px); bottom:clamp(14px,3.5vw,30px); display:flex; flex-direction:column; gap:10px; pointer-events:none;">
          <div style="font-family:'Jost',sans-serif; font-weight:400; font-size:11px; letter-spacing:0.4em; text-transform:uppercase; color:#cbb17a;">{{ subtitle }}</div>
          <div style="font-family:'Cormorant Garamond',serif; font-weight:500; font-size:clamp(26px,3vw,44px); letter-spacing:0.06em; color:#f4eee1; line-height:1.05;">{{ title }}</div>
          <sc-if value="{{ hasDescription }}" hint-placeholder-val="{{ false }}">
            <div style="font-family:'Cormorant Garamond',serif; font-style:italic; font-size:18px; color:rgba(244,238,225,0.7); max-width:560px;">{{ description }}</div>
          </sc-if>
        </div>
      </button>
    </sc-if>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{
  &quot;$preview&quot;: {&quot;width&quot;: 960, &quot;height&quot;: 540},
  &quot;title&quot;: {&quot;editor&quot;: &quot;text&quot;, &quot;default&quot;: &quot;Fuente de Misericordia&quot;, &quot;tsType&quot;: &quot;string&quot;},
  &quot;subtitle&quot;: {&quot;editor&quot;: &quot;text&quot;, &quot;default&quot;: &quot;Video Audiovisual Oficial&quot;, &quot;tsType&quot;: &quot;string&quot;},
  &quot;youtubeUrl&quot;: {&quot;editor&quot;: &quot;text&quot;, &quot;default&quot;: &quot;https://youtu.be/lalOdAlhWxc&quot;, &quot;tsType&quot;: &quot;string&quot;},
  &quot;thumbnail&quot;: {&quot;editor&quot;: &quot;text&quot;, &quot;default&quot;: null, &quot;tsType&quot;: &quot;string | null&quot;},
  &quot;featured&quot;: {&quot;editor&quot;: &quot;boolean&quot;, &quot;default&quot;: true, &quot;tsType&quot;: &quot;boolean&quot;},
  &quot;description&quot;: {&quot;editor&quot;: &quot;text&quot;, &quot;default&quot;: &quot;&quot;, &quot;tsType&quot;: &quot;string&quot;}
}">
class Component extends DCLogic {
  state = { playing: false, thumbFallback: false };
  componentDidMount() {
    this._esc = (e) => { if (e.key === 'Escape' && this.state.playing) this.setState({ playing: false }); };
    window.addEventListener('keydown', this._esc);
  }
  componentWillUnmount() { window.removeEventListener('keydown', this._esc); }
  videoId() {
    const m = (this.props.youtubeUrl || '').match(/(?:youtu\.be\/|v=|embed\/|shorts\/)([\w-]{11})/);
    return m ? m[1] : '';
  }
  renderVals() {
    const id = this.videoId();
    const title = this.props.title ?? '';
    return {
      playing: this.state.playing,
      notPlaying: !this.state.playing,
      title,
      subtitle: this.props.subtitle ?? '',
      description: this.props.description ?? '',
      hasDescription: !!this.props.description,
      thumbUrl: this.props.thumbnail ?? ('https://i.ytimg.com/vi/' + id + (this.state.thumbFallback ? '/hqdefault.jpg' : '/maxresdefault.jpg')),
      thumbError: () => this.setState({ thumbFallback: true }),
      embedUrl: 'https://www.youtube.com/embed/' + id + '?autoplay=1&rel=0',
      iframeTitle: title || 'Video oficial de Carmen Rosa',
      ariaPlay: 'Reproducir video: ' + (title || 'video oficial de Carmen Rosa'),
      play: () => this.setState({ playing: true })
    };
  }
}
</script>
</body>
</html>
